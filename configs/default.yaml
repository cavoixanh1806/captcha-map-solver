# Default configuration for captcha-map-solver
# Hardware target: NVIDIA RTX 3060 8GB VRAM (CUDA 12.8+), i5-12400F, 16GB RAM

data:
  data_dir: data
  metadata: data/metadata.csv
  splits_file: configs/splits.json
  train_size: 400
  val_size: 50
  test_size: 50
  seed: 42

image:
  height: 128
  width: 128
  alphabet: "3479ACDEFHJKLMNPQRTUVWXY"
  char_len: 5

augment:
  # Aggressive augmentation: 400 mau qua nho, model du sung memorize.
  # Moi ky tu mot mau ngau nhien => co the jitter hue manh hon de buoc model hoc shape.
  rotation_degrees: 12
  translate: 0.08
  scale_min: 0.80
  scale_max: 1.20
  shear: 8
  brightness: 0.30
  contrast: 0.30
  saturation: 0.30
  hue: 0.15
  random_erasing_prob: 0.50
  random_erasing_scale_min: 0.02
  random_erasing_scale_max: 0.20

solver:
  backbone: conv          # conv (~5M) | resnet18 (~11M) | resnet34 (~21M)
  pretrained: false       # ImageNet prior khong giup tren captcha noisy + colorful
  optimizer: adamw
  lr: 1.0e-3
  weight_decay: 5.0e-3    # weight decay lon de chong overfit
  scheduler: cosine
  batch_size: 32
  epochs: 200
  precision: 16-mixed
  num_workers: 4
  early_stopping_patience: 30
  dropout: 0.5
  label_smoothing: 0.05

logging:
  log_dir: tb_logs
  ckpt_dir: checkpoints
  exp_name: baseline-resnet18
