# Frozen TrOCR encoder + per-position multi-head classifier.
#
# Why: 400 samples are too few to fine-tune any autoregressive seq2seq
# without exposure bias. Freezing the pretrained DeiT-small encoder gives us
# strong shape priors for free, and we only train a small cross-attention
# head (~1M params) which cannot overfit the way 61M-param TrOCR or 11M-param
# ResNet-18 did.

data:
  data_dir: data
  metadata: data/metadata.csv
  splits_file: configs/splits.json
  train_size: 400
  val_size: 50
  test_size: 50
  seed: 42

image:
  alphabet: "3479ACDEFHJKLMNPQRTUVWXY"
  char_len: 5

solver:
  task: encoder_clf
  pretrained_model: microsoft/trocr-small-printed
  unfreeze_last_n: 2     # adapt last 2 DeiT blocks to captcha style; rest frozen
  dropout: 0.2
  label_smoothing: 0.05
  optimizer: adamw
  lr: 5.0e-4
  weight_decay: 0.01
  scheduler: cosine
  batch_size: 16
  epochs: 80
  precision: 16-mixed
  num_workers: 2
  early_stopping_patience: 20

logging:
  log_dir: tb_logs
  ckpt_dir: checkpoints
  exp_name: encoder-clf
