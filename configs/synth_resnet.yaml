# Synthetic + real training with a small ResNet18 multi-head classifier.
#
# The pipeline (see research.md / chat history): every previous attempt
# (multi-head, CRNN+CTC, full TrOCR fine-tune, frozen-encoder + queries,
# spatial split pool) hit a wall because 400 real labelled samples just isn't
# enough. We add 5000 synthetic captchas per epoch (rendered by src/synth.py)
# alongside the 400 real ones, so the model sees thousands of fresh
# shape/colour combinations per epoch. Val and test stay 100% real.

data:
  data_dir: data
  metadata: data/metadata.csv
  splits_file: configs/splits.json
  train_size: 400
  val_size: 50
  test_size: 50
  seed: 42

image:
  height: 128
  width: 128
  alphabet: "3479ACDEFHJKLMNPQRTUVWXY"
  char_len: 5

augment:
  rotation_degrees: 5
  translate: 0.04
  scale_min: 0.92
  scale_max: 1.08
  shear: 3
  brightness: 0.15
  contrast: 0.15
  saturation: 0.15
  hue: 0.05
  random_erasing_prob: 0.20
  random_erasing_scale_min: 0.02
  random_erasing_scale_max: 0.10

solver:
  task: head
  backbone: resnet18
  pretrained: true
  synth_per_epoch: 5000   # 5000 synthetic + 400 real per epoch
  optimizer: adamw
  lr: 5.0e-4
  weight_decay: 1.0e-3
  scheduler: cosine
  batch_size: 64
  epochs: 30
  precision: 16-mixed
  num_workers: 4
  early_stopping_patience: 8
  dropout: 0.3
  label_smoothing: 0.05

logging:
  log_dir: tb_logs
  ckpt_dir: checkpoints
  exp_name: synth-resnet18
